apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: backend-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:13
        command: ["sh", "-c", "until pg_isready -h postgres-service -p 5432 -U admin; do echo waiting for postgres; sleep 2; done;"]
        env:
        - name: PGPASSWORD
          value: "admin123"
      containers:
      - name: backend
        image: docker.io/rafaelmao/node-codigo-rafael:latest
        ports:
        - containerPort: 3000
        env:
        - name: MY_DATABASE_DRIVER
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MY_DATABASE_DRIVER
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: DB_HOST
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: DB_NAME
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: DB_PORT
        - name: DB_USER_NAME
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_USER_NAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_PASSWORD
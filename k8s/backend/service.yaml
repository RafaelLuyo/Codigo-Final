apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: backend-namespace
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: backend-namespace
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  replicas: 2  # Mínimo 2 pods requerido
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      # InitContainer para esperar que la DB esté lista (funciona con cualquier driver)
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: 
        - sh
        - -c
        - |
          echo "Esperando a que la base de datos esté lista..."
          echo "Driver: $MY_DATABASE_DRIVER"
          echo "Host: $DB_HOST"
          echo "Puerto: $DB_PORT"
          until nc -z $DB_HOST $DB_PORT; do
            echo "Base de datos no disponible en $DB_HOST:$DB_PORT, esperando..."
            sleep 2
          done
          echo "Base de datos lista!"
        env:
        - name: MY_DATABASE_DRIVER
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MY_DATABASE_DRIVER
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: DB_PORT
      containers:
      - name: backend
        image: docker.io/rafaelmao/node-codigo-rafael:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: MY_DATABASE_DRIVER
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MY_DATABASE_DRIVER
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: DB_HOST
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: DB_NAME
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: DB_PORT
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: NODE_ENV
        - name: DB_USER_NAME
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_USER_NAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_PASSWORD
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        # RECURSOS MÍNIMOS para cluster pequeño
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"

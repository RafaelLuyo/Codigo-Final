name: Deploy Backend to GKE

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: project-762c7709-7568-49f1-b91
  GKE_CLUSTER: codigo-rafael
  GKE_ZONE: us-central1
  BACKEND_IMAGE: docker.io/rafaelmao/node-codigo-rafael
  BACKUP_IMAGE: docker.io/rafaelmao/backup

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ env.BACKEND_IMAGE }}:latest
          ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Backup image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.backup
        push: true
        tags: |
          ${{ env.BACKUP_IMAGE }}:latest
          ${{ env.BACKUP_IMAGE }}:${{ github.sha }}
        no-cache: true

  deploy:
    name: Deploy to GKE
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/455355438110/locations/global/workloadIdentityPools/github-pool/providers/github-provider
        service_account: github-actions-sa@project-762c7709-7568-49f1-b91.iam.gserviceaccount.com

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Install GKE auth plugin
      run: |
        gcloud components install gke-gcloud-auth-plugin --quiet

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials $GKE_CLUSTER \
          --zone $GKE_ZONE \
          --project $PROJECT_ID

    # ==========================================
    # 1. Deploy Base Resources (Namespace, ConfigMap, Secrets)
    # ==========================================
    - name: Deploy Namespace
      run: kubectl apply -f k8s/base/namespace.yaml

    - name: Deploy ConfigMap
      run: kubectl apply -f k8s/base/configmap.yaml

    - name: Deploy DB Secret
      run: kubectl apply -f k8s/base/secret.yaml

    - name: Create AWS Secret
      run: |
        kubectl delete secret aws-secret \
          --namespace=backend-namespace \
          --ignore-not-found
        
        kubectl create secret generic aws-secret \
          --namespace=backend-namespace \
          --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
          --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
          --from-literal=AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}"

    # ==========================================
    # 2. Deploy Database (PostgreSQL por defecto)
    # ==========================================
    - name: Deploy PostgreSQL
      run: |
        kubectl apply -f k8s/databases/postgres/configmap.yaml
        kubectl apply -f k8s/databases/postgres/pvc.yaml
        kubectl apply -f k8s/databases/postgres/deployment.yaml
        kubectl apply -f k8s/databases/postgres/service.yaml

    - name: Wait for PostgreSQL to be ready
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        kubectl wait --for=condition=ready pod \
          -l app=postgres \
          -n backend-namespace \
          --timeout=300s

    # ==========================================
    # 3. Deploy Backend Application
    # ==========================================
    - name: Deploy Backend
      run: |
        kubectl apply -f k8s/backend/deployment.yaml
        kubectl apply -f k8s/backend/service.yaml

    - name: Wait for Backend to be ready
      run: |
        echo "Waiting for Backend pods to be ready..."
        kubectl wait --for=condition=ready pod \
          -l app=backend \
          -n backend-namespace \
          --timeout=300s

    # ==========================================
    # 4. Deploy CronJob for Backups
    # ==========================================
    - name: Deploy Backup CronJob
      run: kubectl apply -f k8s/cronjobs/backup-cronjob.yaml

    # ==========================================
    # 5. Verification
    # ==========================================
    - name: Verify Deployment
      run: |
        echo "=========================================="
        echo "Deployment Summary"
        echo "=========================================="
        
        echo ""
        echo "Pods in backend-namespace:"
        kubectl get pods -n backend-namespace -o wide
        
        echo ""
        echo "Services:"
        kubectl get services -n backend-namespace
        
        echo ""
        echo "Deployments:"
        kubectl get deployments -n backend-namespace
        
        echo ""
        echo "CronJobs:"
        kubectl get cronjobs -n backend-namespace
        
        echo ""
        echo "Backend pod count (should be >= 2):"
        BACKEND_PODS=$(kubectl get pods -n backend-namespace -l app=backend --field-selector=status.phase=Running -o name | wc -l)
        echo "Running backend pods: $BACKEND_PODS"
        
        if [ "$BACKEND_PODS" -lt 2 ]; then
          echo "WARNING: Less than 2 backend pods running!"
          exit 1
        fi
        
        echo ""
        echo "=========================================="
        echo "Deployment completed successfully!"
        echo "=========================================="

    - name: Get External IP
      run: |
        echo "Waiting for LoadBalancer external IP..."
        for i in {1..30}; do
          EXTERNAL_IP=$(kubectl get service backend-service -n backend-namespace -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          if [ -n "$EXTERNAL_IP" ]; then
            echo "External IP: $EXTERNAL_IP"
            echo "Backend URL: http://$EXTERNAL_IP"
            break
          fi
          echo "Waiting for external IP... ($i/30)"
          sleep 10
        done